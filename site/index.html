<style>
:root{--bg:#fff;--fg:#1c2330;--mut:#5b6575;--ac:#2563eb;--bd:#d9dee7;--card:#f6f8fb;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--fg:#e6e9ef;--mut:#9aa4b5;--ac:#6ea0ff;--bd:#2a3140;--card:#171c26}}
*{box-sizing:border-box}body{margin:0;font:16px/1.65 "Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;min-height:100vh}
nav{width:270px;border-right:1px solid var(--bd);padding:16px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card)}
nav h1{font-size:1rem;margin:0 0 12px}nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:.92rem}

main{flex:1;max-width:860px;padding:24px 28px;margin:auto}
h2{margin-top:0}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top}

.note,.warn{padding:10px 14px;border-radius:8px;margin:12px 0}.note{background:var(--card);border-left:4px solid var(--ac)}.warn{background:var(--card);border-left:4px solid #d97706}
.cite{font-size:.75rem;vertical-align:super;text-decoration:none}

.cp{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:.75rem}
.res{margin-top:8px}.good{color:var(--ok)}.badc{color:var(--bad)}

<script>
const MODS=[{"id": "m1", "title": "วิดีโอคือโปรแกรม", "obj": "เข้าใจว่า motion graphics ที่ AI ทำได้มี 2 ทาง และทางไหนเหมาะกับงานแบบไหน", "body": "<h3>2 ทางที่ AI ทำวิดีโอได้</h3>\n<table><tr><th></th><th>ทางโค้ด</th><th>ทางโมเดลวิดีโอ</th></tr>\n<tr><td>หลักการ</td><td>Claude เขียนโปรแกรม โปรแกรมวาดภาพทีละเฟรม</td><td>โมเดล generative สร้างพิกเซลจาก prompt</td></tr>\n<tr><td>จุดแข็ง</td><td>ตัวหนังสือ ตัวเลข กราฟ ตรงเป๊ะ แก้จุดเดียวแล้วเรนเดอร์ใหม่ ผลซ้ำได้</td><td>คน ผิว ผ้า ควัน ฉากที่ถ่ายยาก</td></tr>\n<tr><td>จุดอ่อน</td><td>ภาพเหมือนจริงทำยาก</td><td>ตัวอักษรบนป้ายเพี้ยน คลิปยาวแสงเพี้ยน ผลไม่ซ้ำทุกครั้ง</td></tr>\n<tr><td>ต้นทุน</td><td>CPU + เวลาเรนเดอร์</td><td>GPU หนัก (หรือเช่า) + ไลเซนส์โมเดล</td></tr></table>\n<p>หลักคิดสำคัญ: <b>วิดีโอที่เขียนด้วยโค้ดคือไฟล์ต้นฉบับที่ diff และ review ได้</b> เหมือนซอร์สโค้ด เปลี่ยนสี เปลี่ยนข้อความ เปลี่ยนจังหวะ ทำที่บรรทัดเดียวได้</p>\n<div class=\"note\">ที่มาของกรอบ 2 ทาง: คลิปแนะนำคอร์สของผู้สอนรายหนึ่งและบทความอิสระ <a class=\"cite\" href=\"#/refs\" title=\"Motion Graphics with Claude for Free (Thornelo)\">[R10]</a> เนื้อหาในโมดูลนี้เป็นการเรียบเรียงใหม่ ไม่ได้คัดลอกเนื้อหาคอร์สต้นฉบับ</div>\n<h3>เลือกทางไหน</h3>\n<ul><li>มีตัวหนังสือไทย ตัวเลข กราฟ โลโก้ → ทางโค้ด</li><li>ต้องการคนพูด/ฉากจริง → ทางโมเดลวิดีโอ แล้วซ้อนตัวหนังสือด้วยโค้ดทับอีกที</li><li>งานจริงมักใช้ผสมกัน: โมเดลทำภาพ โค้ดทำตัวอักษรและตรวจผล</li></ul>", "quiz": [{"q": "Motion graphics ที่ต้องมีตัวหนังสือไทยตรงทุกตัวอักษร ควรเริ่มจากทางไหน", "o": ["ทางโมเดลวิดีโอ", "ทางโค้ด", "ถ่ายด้วยกล้อง"], "a": 1, "w": "ทางโค้ดคุมตำแหน่งและตัวอักษรได้เอง ส่วนโมเดลวิดีโอมักทำตัวอักษรเพี้ยน <a class=\"cite\" href=\"#/refs\" title=\"Motion Graphics with Claude for Free (Thornelo)\">[R10]</a>"}, {"q": "ข้อได้เปรียบของวิดีโอที่เป็นโค้ดคือข้อใด", "o": ["แก้จุดเดียวแล้วเรนเดอร์ใหม่ได้ ผลซ้ำได้", "ไม่ต้องใช้ CPU", "ไม่ต้องมีฟอนต์"], "a": 0, "w": "โค้ดเป็นต้นฉบับที่เรนเดอร์ใหม่ได้ผลเหมือนเดิม"}]}, {"id": "m2", "title": "ตั้งสตูดิโอ: Remotion + Claude Code", "obj": "สร้างโปรเจกต์ Remotion ติดตั้ง skill และสั่ง Claude Code ในโฟลเดอร์โปรเจกต์ได้", "body": "<h3>ขั้นตอนตามเอกสาร Remotion <a class=\"cite\" href=\"#/refs\" title=\"Remotion — Prompting videos with coding agents\">[R1]</a><a class=\"cite\" href=\"#/refs\" title=\"Remotion — Agent Skills\">[R2]</a></h3>\n<pre><code>npx create-video --yes --blank my-video\ncd my-video\nnpx remotion skills add      # ติดตั้ง Remotion Agent Skills\nnpm run dev                  # เปิด Studio พรีวิว\n# เทอร์มินัลอีกหน้าต่าง\ncd my-video &amp;&amp; claude</code></pre>\n<p>Skill ที่เอกสารระบุ: <code>/remotion-best-practices</code> (ครอบคลุมทุกเรื่อง), <code>/remotion-create</code>, <code>/remotion-markup</code>, <code>/remotion-render</code>, <code>/remotion-captions</code> และ <code>/remotion-docs</code> สำหรับค้นเอกสารก่อนเขียนโค้ด <a class=\"cite\" href=\"#/refs\" title=\"Remotion — Agent Skills\">[R2]</a></p>\n<h3>โครงคอมโพเนนต์พื้นฐาน <a class=\"cite\" href=\"#/refs\" title=\"Remotion — The fundamentals\">[R3]</a></h3>\n<pre><code>import {AbsoluteFill, useCurrentFrame} from \"remotion\";\nexport const Title = () =&gt; {\n  const frame = useCurrentFrame();           // เลขเฟรมปัจจุบัน\n  return (\n    &lt;AbsoluteFill style={{justifyContent:\"center\",alignItems:\"center\",\n                          fontSize:100, backgroundColor:\"white\"}}&gt;\n      The current frame is {frame}.\n    &lt;/AbsoluteFill&gt;\n  );\n};</code></pre>\n<div class=\"warn\"><b>ไลเซนส์ <a class=\"cite\" href=\"#/refs\" title=\"Remotion Pro — Licensing\">[R6]</a>:</b> Remotion ฟรีสำหรับบุคคลและบริษัทที่มีไม่เกิน 3 คน ถ้าใช้ในองค์กรที่ใหญ่กว่านั้นต้องมี Company License ตรวจเงื่อนไขล่าสุดที่ลิงก์ก่อนใช้งานเชิงพาณิชย์</div>\n<p>ทางเลือกที่ไม่ใช้ React: HyperFrames เขียน HTML แล้วเรนเดอร์เป็นวิดีโอ ไลเซนส์ Apache-2.0 <a class=\"cite\" href=\"#/refs\" title=\"HyperFrames (heygen-com/hyperframes)\">[R7]</a></p>", "quiz": [{"q": "คำสั่งใดติดตั้งชุด skill ของ Remotion", "o": ["npm run dev", "npx remotion skills add", "claude init"], "a": 1, "w": "ตามเอกสาร <a class=\"cite\" href=\"#/refs\" title=\"Remotion — Prompting videos with coding agents\">[R1]</a>"}, {"q": "บริษัทที่มีพนักงาน 50 คนจะใช้ Remotion เชิงพาณิชย์ต้องทำอย่างไร", "o": ["ใช้ฟรีได้เลย", "ขอ Company License", "เปลี่ยนเป็น HTML ล้วนเท่านั้น"], "a": 1, "w": "ฟรีถึง 3 คน เกินนั้นต้องมี Company License <a class=\"cite\" href=\"#/refs\" title=\"Remotion Pro — Licensing\">[R6]</a>"}]}, {"id": "m3", "title": "Brief → Storyboard → Style guide", "obj": "เขียน brief ให้ Claude สร้างงานที่คุมได้ แทนที่จะสั่งแบบกว้างๆ", "body": "<h3>ทำไมต้องมี brief</h3>\n<p>คำสั่ง \"ทำวิดีโอเท่ๆ\" ได้งานที่สุ่ม brief ที่ดีทำให้ผลตรวจได้ว่าถูกหรือผิด</p>\n<h3>เทมเพลต brief (คัดลอกใช้ได้)</h3>\n<pre><code>วัตถุประสงค์: อธิบาย ______ ให้ ______ เข้าใจใน 30 วินาที\nขนาด/เฟรมเรต: 1920x1080, 30 fps, ความยาว 30 วินาที\nสไตล์: สีหลัก #___ พื้นหลัง #___ ฟอนต์ ___ (รองรับภาษาไทย)\nฉาก:\n  1) 0-5s  ชื่อเรื่อง ข้อความ \"___\"\n  2) 5-15s แผนภาพ ___ ทีละขั้น\n  3) 15-30s สรุป + call to action\nกฎตรวจรับ: ข้อความทุกบรรทัดต้องไม่ล้นกรอบ, สีตัวอักษรต่างพื้นหลัง contrast &gt;= 4.5:1</code></pre>\n<h3>Style guide เป็นไฟล์เดียว</h3>\n<p>เก็บค่าสี ฟอนต์ ระยะขอบ และ easing ไว้ในไฟล์ <code>theme.ts</code> ให้ทุกฉากอ่านจากไฟล์นี้ ผลคือเปลี่ยนแบรนด์ทีเดียวทั้งวิดีโอ</p>", "quiz": [{"q": "ข้อใดเป็นกฎตรวจรับที่ตรวจได้โดยเครื่อง", "o": ["ภาพดูสวย", "ข้อความไม่ล้นกรอบและ contrast ถึงเกณฑ์", "บรรยากาศดี"], "a": 1, "w": "ต้องวัดได้จึงจะให้ Claude ตรวจเองได้"}]}, {"id": "m4", "title": "ตัวหนังสือไทยและฟอนต์", "obj": "ทำให้ตัวหนังสือไทยแสดงถูกต้อง โหลดฟอนต์ก่อนเรนเดอร์ และเข้าใจปัญหาวรรณยุกต์", "body": "<h3>โหลดฟอนต์ให้ครบก่อนเรนเดอร์ <a class=\"cite\" href=\"#/refs\" title=\"Remotion — loadFont() (@remotion/google-fonts)\">[R4]</a></h3>\n<pre><code>import {loadFont} from \"@remotion/google-fonts/NotoSansThai\";\nconst {fontFamily} = loadFont(\"normal\", {weights:[\"400\",\"700\"], subsets:[\"thai\"]});\n// ใช้ style={{fontFamily}} ในคอมโพเนนต์</code></pre>\n<p>เอกสารระบุว่า <code>loadFont()</code> จะ block การเรนเดอร์จนฟอนต์พร้อม และให้เลือกเฉพาะน้ำหนัก/subset ที่ต้องใช้ <a class=\"cite\" href=\"#/refs\" title=\"Remotion — loadFont() (@remotion/google-fonts)\">[R4]</a> (ชื่อแพ็กเกจ NotoSansThai เป็นไปตามรูปแบบของ @remotion/google-fonts ควรตรวจชื่อจริงตอนติดตั้ง)</p>\n<h3>ปัญหาที่พบบ่อยกับภาษาไทย</h3>\n<ul><li>วรรณยุกต์/สระลอยชนบรรทัดบน ถ้า line-height ต่ำเกินไป เริ่มทดลองที่ 1.4–1.6</li><li>การตัดบรรทัด: ภาษาไทยไม่มีช่องว่างระหว่างคำ ต้องกำหนดจุดตัดเองหรือใช้ <code>word-break</code> ให้เหมาะ</li><li>ฟอนต์ไม่มีสระบางตัว ทำให้ขึ้นกล่องสี่เหลี่ยม ตรวจด้วยการเรนเดอร์ข้อความทดสอบครบทุกตัวอักษรก่อน</li></ul>\n<h3>แล็บ: ข้อความทดสอบฟอนต์</h3>\n<pre><code>กขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ\nะัาำิีึืุูเแโใไๅ ็่้๊๋์ ปู่ ป้า ผู้ ที่ นี้ ก็ ก๊ก</code></pre>\n<p>เรนเดอร์ข้อความนี้ในทุกฟอนต์ที่จะใช้ แล้วดูด้วยตาและใช้สคริปต์ตรวจเฟรมในโมดูล 7</p>", "quiz": [{"q": "ทำไมต้องใช้ loadFont() ก่อนเรนเดอร์", "o": ["ให้ไฟล์เล็กลง", "ให้เรนเดอร์รอจนฟอนต์พร้อม ไม่ตกไปใช้ฟอนต์สำรอง", "ให้เสียงชัด"], "a": 1, "w": "เอกสารระบุว่า block การเรนเดอร์จนฟอนต์พร้อม <a class=\"cite\" href=\"#/refs\" title=\"Remotion — loadFont() (@remotion/google-fonts)\">[R4]</a>"}]}, {"id": "m5", "title": "แอนิเมชันและจังหวะ", "obj": "เขียนแอนิเมชันที่อิงเฟรม ใช้ interpolate/spring และจัดลำดับฉาก", "body": "<h3>หลักคิด: ทุกอย่างคือฟังก์ชันของเฟรม</h3>\n<p>ใน Remotion ค่าภาพทุกอย่างคำนวณจาก <code>useCurrentFrame()</code> <a class=\"cite\" href=\"#/refs\" title=\"Remotion — The fundamentals\">[R3]</a> ไม่มี timer ไม่มี state ที่เปลี่ยนเอง เรนเดอร์ซ้ำจึงได้ผลเดิม</p>\n<pre><code>import {interpolate, spring, useCurrentFrame, useVideoConfig} from \"remotion\";\nconst frame = useCurrentFrame();\nconst {fps} = useVideoConfig();\nconst opacity = interpolate(frame, [0, 15], [0, 1], {extrapolateRight:\"clamp\"});\nconst lift = spring({frame, fps, config:{damping:200}});</code></pre>\n<p>ข้อสังเกต: ตัวอย่างโค้ดนี้อิงชื่อ API ที่ใช้ทั่วไปของ Remotion ผมเปิดอ่านหน้า fundamentals <a class=\"cite\" href=\"#/refs\" title=\"Remotion — The fundamentals\">[R3]</a> ได้เฉพาะ <code>useCurrentFrame</code> และ <code>AbsoluteFill</code> ส่วน <code>interpolate</code>/<code>spring</code> ให้ใช้ skill <code>/remotion-docs</code> <a class=\"cite\" href=\"#/refs\" title=\"Remotion — Agent Skills\">[R2]</a> ตรวจ signature ก่อนใช้</p>\n<h3>กฎจังหวะ</h3><ul><li>ข้อความหนึ่งบรรทัดควรอยู่บนจอ ≥ 1.5 วินาที + เวลาอ่านตามความยาว</li><li>ใช้ easing เดียวกันทั้งงาน</li><li>เข้า 8–15 เฟรม ออกเร็วกว่าเข้า</li></ul>", "quiz": [{"q": "ทำไมแอนิเมชันของ Remotion เรนเดอร์ซ้ำแล้วได้ผลเดิม", "o": ["ใช้ GPU", "ทุกค่าคำนวณจากเลขเฟรม ไม่ใช่เวลาจริง", "แคชผลไว้"], "a": 1, "w": "ค่าภาพเป็นฟังก์ชันของ useCurrentFrame <a class=\"cite\" href=\"#/refs\" title=\"Remotion — The fundamentals\">[R3]</a>"}]}, {"id": "m6", "title": "เสียงบรรยายและซับไตเติล", "obj": "สร้างเสียงบรรยายด้วย Gemini TTS และทำซับให้ตรงกับสคริปต์", "body": "<h3>เลือกโมเดลเสียง <a class=\"cite\" href=\"#/refs\" title=\"Gemini API — Text-to-speech generation\">[R9]</a></h3>\n<p>เอกสาร Gemini API ระบุโมเดล TTS 2 ตัว: <code>gemini-3.8-flash-tts</code> และ <code>gemini-3.8-flash-lite-tts</code> รองรับเสียงผู้พูดเดียวและหลายคน ควบคุมสไตล์ด้วย inline tag <a class=\"cite\" href=\"#/refs\" title=\"Gemini API — Text-to-speech generation\">[R9]</a> การรองรับภาษาไทยของแต่ละเสียงและโควตารายวันให้ตรวจที่หน้า Models/Rate limits ของ Google เพราะเปลี่ยนบ่อย (ผมไม่ได้ยืนยันตัวเลขโควตาจากเอกสารที่เปิดอ่านในรอบนี้)</p>\n<h3>กฎเขียนสคริปต์บรรยายภาษาไทย</h3>\n<ul><li>เขียนตัวเลขเป็นคำอ่าน</li><li>ใส่ช่องว่างทุก 2–6 คำ เพื่อให้ซับตัดบรรทัดได้</li><li>ซับต้องมาจากสคริปต์ ไม่ใช่จากการถอดเสียง เพื่อไม่ให้คำที่ whisper ฟังผิดไปโผล่บนจอ</li></ul>\n<h3>ตรวจระดับเสียงด้วย FFmpeg <a class=\"cite\" href=\"#/refs\" title=\"FFmpeg Filters Documentation\">[R11]</a></h3>\n<pre><code>ffmpeg -i narration.wav -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 48000 out.wav</code></pre>\n<p>ส่งออกที่ 48 kHz เพื่อกันปัญหาเล่นกระตุกบนบางอุปกรณ์</p>\n<div class=\"warn\">เสียงที่ทำเลียนแบบบุคคลจริงต้องมีความยินยอมเป็นลายลักษณ์อักษร และห้ามเผยแพร่ไฟล์ตัวอย่างเสียงของบุคคลนั้น</div>", "quiz": [{"q": "ซับไตเติลควรมาจากอะไร", "o": ["ผลถอดเสียงอัตโนมัติ", "สคริปต์ต้นฉบับ", "ตัวอย่างที่คนอื่นทำ"], "a": 1, "w": "จะไม่มีคำที่ถอดเสียงผิดหลุดขึ้นจอ"}]}, {"id": "m7", "title": "ให้ Claude ตรวจงานตัวเอง", "obj": "สร้างลูปตรวจจากพิกเซลจริงของเฟรม ไม่ใช่เชื่อว่าโค้ดถูก", "body": "<h3>หลักการ</h3>\n<p>ก่อนบอกว่าเสร็จ ให้ดึงเฟรมจากวิดีโอที่เรนเดอร์แล้ววัดผลตามกฎตรวจรับใน brief วิธีนี้ตรงกับหลัก \"ตรวจด้วยคำสั่งจริง\" ที่ใช้กับงานโค้ดทั่วไป</p>\n<h3>สคริปต์ที่รันจริงแล้ว (Python มาตรฐาน + ffmpeg)</h3>\n<p>ผมสร้างคลิปทดสอบ 2 วินาที (ดำ 1 วินาที แล้วแดง 1 วินาที) รันสคริปต์ได้ผล <code>0.2 → [0,0,0]</code> และ <code>1.8 → [254,0,0]</code> แปลว่าดึงเฟรมและอ่านสีได้ถูกต้อง</p>\n<pre><code>import subprocess\ndef frame_rgb(video, t, w=64, h=36):\n    raw = subprocess.run([\"ffmpeg\",\"-v\",\"error\",\"-ss\",str(t),\"-i\",video,\n        \"-frames:v\",\"1\",\"-vf\",f\"scale={w}:{h}\",\"-f\",\"rawvideo\",\n        \"-pix_fmt\",\"rgb24\",\"-\"],capture_output=True,check=True).stdout\n    assert len(raw)==w*h*3\n    px=[raw[i:i+3] for i in range(0,len(raw),3)]\n    return [sum(p[c] for p in px)/len(px) for c in range(3)]</code></pre>\n<p>ดาวน์โหลดไฟล์เต็ม: <a href=\"downloads/verify_frame.py\">verify_frame.py</a></p>\n<h3>ลูปตรวจ</h3>\n<ol><li>เรนเดอร์ → ดึงเฟรมที่เวลาสำคัญ (เริ่มฉาก, กลางฉาก, จบฉาก)</li><li>วัดตามกฎ: พื้นที่ข้อความไม่ว่าง, ไม่มีพิกเซลข้อความเกินขอบ, contrast</li><li>ถ้าไม่ผ่าน ให้ Claude แก้เฉพาะจุดแล้ววนซ้ำ ไม่เกิน 3 รอบ แล้วรายงานตามจริง</li></ol>\n<div class=\"note\">ข้อจำกัด: สคริปต์นี้วัดค่าสีเฉลี่ย ยังไม่ได้ตรวจวรรณยุกต์ไทย การตรวจละเอียดต้องใช้ crop ตรงบริเวณข้อความและเทียบกับภาพอ้างอิง</div>", "quiz": [{"q": "ก่อนรายงานว่างานเสร็จ ควรทำอะไร", "o": ["เชื่อว่าโค้ดถูก", "ดึงเฟรมจากวิดีโอที่เรนเดอร์แล้ววัดตามกฎตรวจรับ", "ดูแค่พรีวิว"], "a": 1, "w": "ตรวจจากผลจริง"}]}, {"id": "m8", "title": "โมเดลวิดีโอ (LTX) และไลเซนส์", "obj": "รู้ว่าเมื่อไรควรใช้โมเดลวิ ame, AbsoluteFill, composition</td></tr><tr><td>R4</td><td><a href="https://www.remotion.dev/docs/google-fonts/load-font" target="_blank" rel="noopener noreferrer">Remotion — loadFont() (@remotion/google-fonts)</a><br><small>Remotion</small></td><td>โหลดฟอนต์ก่อนเรนเดอร์ และ block การเรนเดอร์จนฟอนต์พร้อม</td></tr><tr><td>R5</td><td><a href="https://www.remotion.dev/docs/cli/render" target="_blank" rel="noopener noreferrer">Remotion — CLI render</a><br><small>Remotion</small></td><td>ตัวเลือก --codec (h264 เป็นค่าเริ่มต้น)</td></tr><tr><td>R6</td><td><a href="https://remotion.pro/license" target="_blank" rel="noopener noreferrer">Remotion Pro — Licensing</a><br><small>Remotion</small></td><td>ฟรีสำหรับบุคคลและบริษัทไม่เกิน 3 คน; เกินนั้นต้องมี Company License</td></tr><tr><td>R7</td><td><a href="https://github.com/heygen-com/hyperframes" target="_blank" rel="noopener noreferrer">HyperFrames (heygen-com/hyperframes)</a><br><small>HeyGen / GitHub</small></td><td>ทางเลือก HTML→วิดีโอ, Apache-2.0, เปิดอ่านวันที่ 10 ต.ค. 2026 พบ ~59K ดาว</td></tr><tr><td>R8</td><td><a href="https://github.com/Lightricks/LTX-2/blob/main/LICENSE-2" target="_blank" rel="noopener noreferrer">LTX-2 Community License Agreement (5 ม.ค. 2026)</a><br><small>Lightricks</small></td><td>นิยาม Entity รวมบริษัทในเครือ ใช้นับเพดานรายได้; มีฉบับใหม่กว่านี้ที่ยังไม่ได้อ่านเต็ม</td></tr><tr><td>R9</td><td><a href="https://ai.google.dev/gemini-api/docs/speech-generation" target="_blank" rel="noopener noreferrer">Gemini API — Text-to-speech generation</a><br><small>Google</small></td><td>โมเดล gemini-3.8-flash-tts และ gemini-3.8-flash-lite-tts</td></tr><tr><td>R10</td><td><a href="https://thornelo.com/motion-graphics-with-claude/" target="_blank" rel="noopener noreferrer">Motion Graphics with Claude for Free (Thornelo)</a><br><small>Thornelo (บทความอิสระ)</small></td><td>Claude เขียนแอนิเมชันเป็นโค้ด แล้วตัวเรนเดอร์แปลงเป็น MP4; แผนฟรีไม่มี Claude Code</td></tr><tr><td>R11</td><td><a href="https://ffmpeg.org/ffmpeg-filters.html" target="_blank" rel="noopener noreferrer">FFmpeg Filters Documentation</a><br><small>FFmpeg</small></td><td>drawtext, loudnorm, scale, concat ที่ใช้ในแล็บตรวจเฟรม/เสียง</td></tr>`;

function mod(id){const m=MODS.find(x=>x.id==id);if(!m)return"<p>ไม่พบโมดูล</p>";const i=MODS.indexOf(m);
return `<h2>${i+1}. ${m.title}</h2><p><i>เป้าหมาย: ${m.obj}</i></p>${m.body}<h3>แบบทดสอบ</h3>`+m.quiz.map((q,j)=>`<div class="q"><p>${j+1}. ${q.q}</p>${q.o.map((o,k)=>`<label><input type="radio" name="q${j}" value="${k}"> ${o}</label>`).join("")}<div class="res" id="r${j}"></div></div>`).join("")+`<button onclick="grade('${id}')">ตรวจคำตอบ</button> <span id="sc"></span><p style="margin-top:20px">${i>0?`<a href="#/m/${MODS[i-1].id}">← ก่อนหน้า</a> `:""}${i<MODS.length-1?`<a href="#/m/${MODS[i+1].id}">ถัดไป →</a>`:""}</p>`}
function grade(id){const m=MODS.find(x=>x.id==id);let ok=0;m.quiz.forEach((q,j)=>{const s=document.querySelector(`input[name=q${j}]:checked`);const r=$("#r"+j);if(!s){r.innerHTML="<span class=badc>ยังไม่ได้เลือก</span>";return}if(+s.value==q.a){ok++;r.innerHTML=`<span class=good>ถูก</span> — ${q.w}`}else r.innerHTML=`<span class=badc>ยังไม่ถูก ลองคิดใหม่</span>`});
$("#sc").textContent=`ได้ ${ok}/${m.quiz.length}`;if(ok==m.quiz.length){prog[id]=1;localStorage.setItem(KEY,JSON.stringify(prog));menu()}}
function about(){return `<h2>ขอบเขตและข้อจำกัด</h2><ul><li>เนื้อหาอ้างอิงเอกสารสาธารณะที่เปิดอ่านได้ในวันที่ 10 ต.ค. 2026 ดูหน้าแหล่งอ้างอิง</li><li>สิ่งที่ <b>รันทดสอบจริง</b>: สคริปต์ตรวจเฟรมในโมดูล 7 (ffmpeg + Python) นอกนั้นเป็นการเรียบเรียงจากเอกสาร ตัวอย่างโค้ด Remotion ยังไม่ได้เรนเดอร์ในสภาพแวดล้อมนี้</li><li>ยังไม่ได้ยืนยัน: ชื่อแพ็กเกจฟอนต์ไทยที่แน่นอน, signature ของ interpolate/spring, โควตา Gemini TTS, ข้อความไลเซนส์ LTX ฉบับล่าสุด</li><li>คอร์สต้นทางที่เป็นแรงบันดาลใจเป็นผลิตภัณฑ์ขายของผู้อื่น เรามีเพียงคลิปแนะนำ จึงไม่ได้ทำสำเนาโครงหรือเนื้อหาบทเรียนของเขา</li><li>ไม่ใช่คำแนะนำทางกฎหมายเรื่องไลเซนส์</li></ul>`}
function refs(){return `<h2>แหล่งอ้างอิง</h2><table><tr><th>#</th><th>แหล่ง</th><th>ใช้สนับสนุนเรื่อง</th></tr>${REFS}</table>`}
function route(){const h=location.hash||"#/";let v;if(h=="#/refs")v=refs();else if(h=="#/about")v=about();else if(h.startsWith("#/m/"))v=mod(h.slice(4));else v=home();$("#app").innerHTML=v;
document.querySelectorAll("pre").forEach(p=>{const b=document.createElement("button");b.className="cp";b.textContent="copy";b.onclick=()=>navigator.clipboard.writeText(p.innerText.replace(/^copy/,""));p.appendChild(b)});menu();scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
